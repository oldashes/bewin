name: apply-entry-daily-patch
on:
  push:
    branches:
      - fix/entry-contract-and-daily-sync
jobs:
  apply:
    if: contains(github.event.head_commit.message, '[apply-patch]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/entry-contract-and-daily-sync
      - name: Apply patch and push real file changes
        run: |
          set -euo pipefail
          git apply scripts/patches/entry-and-daily-sync.patch
          rm -f scripts/patches/entry-and-daily-sync.patch
          rm -f .github/workflows/apply-entry-daily-patch.yml
          rmdir scripts/patches 2>/dev/null || true
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Fix position entry aliases and daily EM snapshot/resume"
          git push
