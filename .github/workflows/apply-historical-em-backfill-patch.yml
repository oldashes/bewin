name: apply-historical-em-backfill-patch
on:
  push:
    branches:
      - fix/historical-em-backfill-ths-kline
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/historical-em-backfill-ths-kline
      - name: Apply patch and push real file changes
        run: |
          set -euo pipefail
          if [ ! -f scripts/patches/historical-em-backfill-ths-kline.patch ]; then
            echo "patch already applied"
            exit 0
          fi
          git apply scripts/patches/historical-em-backfill-ths-kline.patch
          rm -f scripts/patches/historical-em-backfill-ths-kline.patch
          rm -f .github/workflows/apply-historical-em-backfill-patch.yml
          rmdir scripts/patches 2>/dev/null || true
          rmdir scripts 2>/dev/null || true
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: skip live EM current-list on historical backfill; resume THS kline"
          git push
